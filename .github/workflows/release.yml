name: Release

# Fires when a version tag is pushed, e.g. by `npm version <patch|minor|major>`
# followed by `git push --follow-tags`. Builds and tests the tagged source,
# creates the GitHub release (tarball, SBOM, OCI image, changelog) and pushes
# the image to GHCR. Publishing to npm is a separate, manual step: publish.yml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag matches package.json version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$pkg" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match package.json version '$pkg'."
            exit 1
          fi

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 26
          package-manager-cache: false

      - run: npm ci

      - name: Type check
        run: node scripts/inject-version.mjs && npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Package tarball
        run: npm pack

      - name: Generate SBOM
        run: npx @cyclonedx/cdxgen@latest -t npm --required-only -o sbom.json

      - name: Attest npm tarball with SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: rewelo-*.tgz
          sbom-path: sbom.json

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Build and push to GHCR
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${{ github.repository }}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg APP_VERSION="$VERSION" \
            --cache-to type=inline \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:latest" \
            --push \
            .

      - name: Export OCI tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${{ github.repository }}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg APP_VERSION="$VERSION" \
            --cache-from "$IMAGE:$VERSION" \
            --output type=oci,dest=rewelo-mcp-"$VERSION"-oci.tar \
            .
          gzip rewelo-mcp-"$VERSION"-oci.tar

      - name: Attest Docker image with SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: rewelo-mcp-*-oci.tar.gz
          sbom-path: sbom.json

      - name: Generate changelog
        run: |
          node scripts/changelog.mjs "$GITHUB_REF_NAME" | tee release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            rewelo-*.tgz \
            rewelo-mcp-*-oci.tar.gz \
            sbom.json \
            CHANGELOG.md
