name: Release

# Fires when a version tag is pushed, e.g. by `npm version <patch|minor|major>`
# followed by `git push --follow-tags`. Builds and tests the tagged source,
# creates the GitHub release (tarball, SBOM, OCI image, changelog) and pushes
# the image to GHCR. Publishing to npm is a separate, manual step: publish.yml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag matches package.json version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$pkg" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match package.json version '$pkg'."
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          package-manager-cache: false

      - run: npm ci

      - name: Type check
        run: node scripts/inject-version.mjs && npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Package tarball
        run: npm pack

      - name: Generate SBOM
        run: npx @cyclonedx/cdxgen@latest -t npm --required-only -o sbom.json

      - name: Attest npm tarball with SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: rewelo-*.tgz
          sbom-path: sbom.json

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Only the newest stable version becomes "latest": a prerelease
      # (v0.7.0-rc.1) or a backport (v0.5.2 after v0.6.1) must not move it.
      - name: Decide the release channel
        id: channel
        run: |
          newest_stable="$(git tag -l 'v*' | grep -v -- '-' | sort -V | tail -n 1)"
          case "$GITHUB_REF_NAME" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          if [ "$GITHUB_REF_NAME" = "$newest_stable" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push to GHCR
        env:
          LATEST: ${{ steps.channel.outputs.latest }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${{ github.repository }}"
          tags=(-t "$IMAGE:$VERSION")
          if [ "$LATEST" = "true" ]; then tags+=(-t "$IMAGE:latest"); fi
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg APP_VERSION="$VERSION" \
            --cache-to type=inline \
            "${tags[@]}" \
            --push \
            .

      - name: Export OCI tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${{ github.repository }}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg APP_VERSION="$VERSION" \
            --cache-from "$IMAGE:$VERSION" \
            --output type=oci,dest=rewelo-mcp-"$VERSION"-oci.tar \
            .
          gzip rewelo-mcp-"$VERSION"-oci.tar

      - name: Attest Docker image with SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: rewelo-mcp-*-oci.tar.gz
          sbom-path: sbom.json

      - name: Generate changelog
        run: |
          node scripts/changelog.mjs "$GITHUB_REF_NAME" | tee release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
          LATEST: ${{ steps.channel.outputs.latest }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --prerelease="$PRERELEASE" \
            --latest="$LATEST" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            rewelo-*.tgz \
            rewelo-mcp-*-oci.tar.gz \
            sbom.json \
            CHANGELOG.md
